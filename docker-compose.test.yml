# Throwaway database for the e2e suite: `docker compose -f docker-compose.test.yml up -d --wait`
name: ircub-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ircub
      POSTGRES_PASSWORD: ircub
      POSTGRES_DB: ircub_test
    ports:
      - '${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ircub -d ircub_test']
      interval: 2s
      timeout: 5s
      retries: 15
